# Deployment: 파드(Pod)를 원하는 개수만큼 유지하고, 롤링 업데이트/롤백을 관리하는 리소스
# 실제로는 Deployment → ReplicaSet → Pod 순서로 생성됨
apiVersion: apps/v1          # 리소스가 속한 API 그룹/버전 (Deployment는 apps 그룹)
kind: Deployment             # 리소스 종류
metadata:
  name: whoami               # 네임스페이스 안에서 유일한 이름 (kubectl get deploy whoami)
spec:                        # "원하는 상태(desired state)" 정의 → 컨트롤러가 현재 상태를 여기에 맞춤
  replicas: 3                # 항상 유지할 파드 개수. 하나가 죽으면 자동으로 새로 띄움

  # 배포 전략: 이미지 변경 등으로 파드를 교체하는 방식
  strategy:
    type: RollingUpdate      # 하나씩 점진적으로 교체 (다른 옵션: Recreate = 전부 내리고 새로 올림)
    rollingUpdate:
      maxSurge: 1            # 교체 중 replicas보다 최대 몇 개 더 띄울 수 있는지 (3+1 = 최대 4개)
      maxUnavailable: 0      # 교체 중 준비 안 된 파드 허용 수. 0 = 항상 3개가 서비스 가능 → 무중단 배포

  # 이 Deployment가 "내 파드"로 관리할 대상을 라벨로 찾는 조건
  # 아래 template.metadata.labels와 반드시 일치해야 함 (생성 후 변경 불가)
  selector:
    matchLabels:
      app: whoami

  # 파드 템플릿: 새 파드를 만들 때 쓰는 설계도
  template:
    metadata:
      labels:
        app: whoami          # 파드에 붙는 라벨 → Deployment selector, Service selector가 이걸로 파드를 찾음
    spec:
      containers:
        - name: whoami                       # 파드 안 컨테이너 이름
          image: traefik/whoami:v1.10.1      # 컨테이너 이미지. latest 대신 버전 태그 고정이 실무 원칙
          ports:
            - containerPort: 80              # 컨테이너가 리슨하는 포트 (문서 역할, 실제 개방은 앱이 결정)

          # readinessProbe: "트래픽 받을 준비가 됐나?"
          # 실패하면 Service 엔드포인트에서 빠짐 (재시작은 안 함)
          readinessProbe:
            httpGet:
              path: /health                  # 이 경로에 HTTP GET, 200~399면 성공
              port: 80
            periodSeconds: 3                 # 3초마다 검사
            failureThreshold: 1              # 1번만 실패해도 즉시 트래픽 차단

          # livenessProbe: "살아 있나?"
          # 연속 실패하면 kubelet이 컨테이너를 재시작
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 3
            failureThreshold: 3              # 3번 연속 실패(약 9초) 시 재시작

          # 리소스 요청/제한
          resources:
            requests:                        # 스케줄링 기준: 이만큼 여유 있는 노드에만 배치
              cpu: 50m                       # 50 밀리코어 = 0.05 CPU
              memory: 32Mi
            limits:                          # 사용 상한
              memory: 64Mi                   # 넘으면 OOMKilled 후 재시작
              # CPU limit은 일부러 생략: 넘으면 죽지는 않고 스로틀링만 걸려서 응답이 느려짐 → 실무에서 흔히 생략
