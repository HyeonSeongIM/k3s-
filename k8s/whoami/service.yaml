# Service: 계속 바뀌는 파드 IP들 앞에 고정된 가상 IP와 DNS 이름을 제공하고, 트래픽을 분산하는 리소스
# 타입을 생략하면 ClusterIP = 클러스터 내부에서만 접근 가능
#   (외부 노출: NodePort / LoadBalancer, 또는 Ingress 사용)
apiVersion: v1               # Service는 core 그룹이라 그룹명 없이 v1
kind: Service
metadata:
  name: whoami               # 클러스터 내부 DNS 이름이 됨 → http://whoami (같은 네임스페이스)
                             #   다른 네임스페이스에서는 whoami.<namespace>.svc.cluster.local
spec:
  # 라벨이 app=whoami인 파드 중 readiness를 통과한 파드로만 트래픽 전달
  selector:
    app: whoami
  ports:
    - port: 80               # Service가 받는 포트 (클라이언트가 접속하는 포트)
      targetPort: 80         # 트래픽을 넘겨줄 파드(컨테이너)의 포트 = containerPort
